name = "evm_opt"
version = "0.1.0"
defaultTargets = ["EvmOpt", "Checks", "Tests", "evmopt"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[require]]
name = "evm_semantics"
path = "evm-semantics"

[[lean_lib]]
name = "EvmOpt"

[[lean_lib]]
name = "Checks"

[[lean_exe]]
name = "evmopt"
root = "Main"

[[lean_lib]]
name = "Tests"
globs = ["Tests.+"]
